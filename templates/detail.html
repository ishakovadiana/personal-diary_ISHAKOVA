{% extends "base.html" %}

{% block content %}
<article class="entry-detail">
    <h2>{{ entry.title }}</h2>
    <p class="entry-date">{{ entry.date }}</p>
    <div class="entry-content">
        <p>{{ entry.content | replace('\n', '<br>') | safe }}</p>
    </div>
    <div class="entry-actions">
        <a href="{{ url_for('edit_entry', entry_id=entry.id) }}" class="btn-edit">✏️ Редактировать</a>
        <form action="{{ url_for('delete_entry', entry_id=entry.id) }}" method="POST" style="display:inline;">
            <button type="submit" class="btn-delete" onclick="return confirm('Удалить запись?')">🗑 Удалить</button>
        </form>
        <a href="{{ url_for('index') }}" class="btn-back">⬅ На главную</a>
    </div>
</article>
{% endblock %}
